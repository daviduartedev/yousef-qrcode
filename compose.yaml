name: yousef-qrcode
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: qrconnect
      POSTGRES_DB: qrconnect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run db:local first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qrconnect -d qrconnect"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
